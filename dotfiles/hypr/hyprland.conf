# CachyOS + NVIDIA: modos confirmados em hyprctl monitors all (2026-10-16)
# LG UltraGear à esquerda (120 Hz); AOC 25G3ZM à direita (240 Hz).
monitor = HDMI-A-1, 1920x1080@119.98, 0x0, 1
monitor = DP-3, 1920x1080@239.96, 1920x0, 1
# Fallback para outras saídas, caso os conectores mudem:
monitor = , preferred, auto, 1
$mod = SUPER
$terminal = ghostty
$menu = fuzzel
$filemanager = ghostty -e yazi
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/binds.conf
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
input {
  kb_layout = us
  kb_variant = intl
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
}
general {
  layout = dwindle
  gaps_in = 5
  gaps_out = 9
  border_size = 1
  col.active_border = rgba(80858dff)
  col.inactive_border = rgba(32363dff)
  resize_on_border = true
}
dwindle {
  pseudotile = true
  preserve_split = true
}
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}
