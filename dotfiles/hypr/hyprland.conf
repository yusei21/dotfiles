# Hyprland NVIDIA / CachyOS. Displays: choose highest advertised refresh
# rate by default; override after checking hyprctl monitors all.
monitor = , highrr, auto, 1
$mod = SUPER
$terminal = ghostty
$menu = fuzzel
$filemanager = ghostty -e yazi
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/binds.conf
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
input {
  kb_layout = us
  kb_variant = intl
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
}
general {
  layout = dwindle
  gaps_in = 5
  gaps_out = 9
  border_size = 1
  col.active_border = rgba(80858dff)
  col.inactive_border = rgba(32363dff)
  resize_on_border = true
}
dwindle {
  pseudotile = true
  preserve_split = true
}
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}
