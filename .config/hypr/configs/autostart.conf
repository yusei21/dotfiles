# Autostart for Hyprstellar on CachyOS

# Kill conflicting notification daemons
exec-once = pkill mako
exec-once = pkill dunst

# Wallpaper backend: CachyOS uses awww instead of swww
exec-once = awww-daemon

# Restore Pywal colors if available
exec-once = test -f ~/.cache/wal/colors.sh && wal -R

# Bars and notifications
exec-once = waybar
exec-once = swaync -c ~/.config/swaync/config.json -s ~/.config/swaync/style.css

# Idle / lock
exec-once = hypridle

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
