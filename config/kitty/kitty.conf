font_family JetBrains Mono
font_size 11
background_opacity 0.92
window_padding_width 8
enable_audio_bell no
include colors.conf

# Copy active terminal and scrollback as plain text.
map ctrl+shift+a launch --type=clipboard --stdin-source=@screen_scrollback

# Let Hyprland manage tiling instead of restoring maximized state.
remember_window_size no
